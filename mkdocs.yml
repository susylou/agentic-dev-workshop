site_name: Agentic Powered Development — Workshop
site_description: Building enterprise apps with AI — on the platform and off it.

theme:
  name: material
  logo: assets/servicenow-logo.svg
  favicon: assets/favicon.svg
  # No Google Fonts. ServiceNow Sans can't be hotlinked (the CDN sends an
  # empty Access-Control-Allow-Origin, so a browser blocks it cross-origin),
  # and Roboto isn't ours — so use the system stack.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/servicenow.css

extra_javascript:
  - javascripts/tasklist-persist.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true

nav:
  - Welcome: index.md
  - Before you start: before-you-start.md
  - The Build Agent lab: track-a-build-agent.md
  - Off-platform build (SDK): track-b-sdk-devin.md
  - Testing with ATF: testing-atf.md
  - Source control & GitHub: source-control-github.md
  - Resources & where next: resources.md
